services:
  race-monitor:
    profiles: [legacy-pt]
    build: .
    container_name: race-monitor
    environment:
      MONITOR_COUNTRY: pt
      MISSING_WORKSHEET_NAME: Missing races PT
      STATE_PATH: /app/data/notified.json
      SCHEDULED_HOUR: ${PT_SCHEDULED_HOUR:-6}
      SCHEDULED_MINUTE: ${PT_SCHEDULED_MINUTE:-2}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./google-credentials.json:/app/google-credentials.json:ro
      - ./session.session:/app/session.session

  race-monitor-es:
    restart: unless-stopped
    profiles: [es]
    build:
      context: .
      dockerfile: Dockerfile.es
    env_file:
      - .env
    environment:
      MONITOR_COUNTRY: es
      ES_SOURCES_JSON: ${ES_SOURCES_JSON:-[]}
      ES_MISSING_WORKSHEET_NAME: Missing races ES
      ES_STATE_PATH: /app/data/notified.json
      SCHEDULED_HOUR: ${ES_SCHEDULED_HOUR:-7}
      SCHEDULED_MINUTE: ${ES_SCHEDULED_MINUTE:-2}
      MAX_PAGINATION_PAGES: ${ES_MAX_PAGINATION_PAGES:-120}
    volumes:
      - ./data/es:/app/data
      - ./logs/es:/app/logs
      - ./google-credentials.json:/app/google-credentials.json:ro
      - ./session.session:/app/session.session

  race-monitor-unified:
    build:
      context: .
      dockerfile: Dockerfile.unified
    image: racefinder-monitor-unified:latest
    container_name: race-monitor-unified
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: unless-stopped
    init: true
    shm_size: '1gb'
    env_file:
      - .env
    environment:
      MONITOR_COUNTRY: both
      TZ: Europe/Moscow
      MISSING_WORKSHEET_NAME: Missing races
      STATE_PATH: /app/data/unified.json
      SCHEDULED_HOUR: ${UNIFIED_SCHEDULED_HOUR:-0}
      SCHEDULED_MINUTE: ${UNIFIED_SCHEDULED_MINUTE:-15}
      RUN_SMOKE_ON_START: 'false'
      TELEGRAM_NOTIFICATIONS_ENABLED: ${TELEGRAM_NOTIFICATIONS_ENABLED:-true}
      ES_SOURCES_JSON: ${ES_SOURCES_JSON:-[]}
      ES_MAX_PAGINATION_PAGES: ${ES_MAX_PAGINATION_PAGES:-120}
      SOURCE_TIMEOUT_SEC: ${SOURCE_TIMEOUT_SEC:-3600}
    volumes:
      - ./data/unified:/app/data
      - ./logs/unified:/app/logs
      - ./google-credentials.json:/app/google-credentials.json:ro
      - ./session.session:/app/session.session
    healthcheck:
      test: ["CMD", "python", "-m", "app.health"]
      interval: 1m
      timeout: 10s
      retries: 2
      start_period: 2h
